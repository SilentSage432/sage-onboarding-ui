apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: sage-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run

          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token

          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: cloudflare-config
